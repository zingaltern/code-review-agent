# 自举 workflow（docs/05§4：M0–M3 仅 PR 触发 + draft 过滤；cli 分发 = M0 仓库内构建，M2 起 Release 二进制）
# 已知平台限制（02§5 触发边界表，显式声明而非假装支持）：
# - 冲突 PR（mergeable=conflicting）的 pull_request workflow 不触发（GitHub 官方行为），
#   冲突解决后的 synchronize 正常触发；
# - fork PR 无 secrets（当前个人仓库无碍，多协作者时引入 App token）。
name: code-review-agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]   # ready_for_review 补 draft 转正场景（05§4 v1.2）

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true   # 被掐断的 run 无 DONE 标记 → 重跑走指纹级补发（02§4.1）

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false   # draft PR 不评审（省成本降噪声）
    steps:
      - uses: actions/checkout@v4        # 供 jgit blame 与 base 分支 REVIEW.md 读取（M1 起消费）
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build or restore CLI       # M0 自举期：仓库内构建 shaded jar（05§4 分发定案）
        run: mvn -B -ntp -pl cra-runner-cli -am package -DskipTests
      - name: Run cra review
        run: |
          java -jar cra-runner-cli/target/cra-runner-cli-0.1.0.jar review \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --depth standard \
            --token "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRA_LLM_API_KEY: ${{ secrets.CRA_LLM_API_KEY }}   # 密钥只从环境变量读（05§6）
          CRA_LLM_BASE_URL: ${{ vars.CRA_LLM_BASE_URL }}
          CRA_LLM_MODEL: ${{ vars.CRA_LLM_MODEL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: persist trace              # 运行器即焚，trace 必须外传（02§5）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cra-trace-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: .cra/runs/
          retention-days: 90
