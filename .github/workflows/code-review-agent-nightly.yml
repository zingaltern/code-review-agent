# M4d 夜间存量评审（docs/05§2.5/§4、07§5）：定时对窗口内历史 PR 批量评审，产出 issue 而非 PR comment。
# 幂等：同一 head commit 已有 DONE 标记的 PR 跳过；全部跳过时不产汇总 issue（05§1.3/§2.5）。
# 成本纪律：默认 depth=quick + --max-prs 上限（06§4 夜间存量口径）。
name: code-review-agent-nightly

on:
  schedule:
    - cron: '0 18 * * *'   # UTC 18:00 = Asia/Shanghai 02:00（夜间低峰）
  workflow_dispatch:        # 手动补跑

permissions:
  contents: read
  pull-requests: read
  issues: write             # 发布逐 PR 夜间 issue 与汇总 issue

concurrency:
  group: review-nightly
  cancel-in-progress: false   # 夜间任务串行；被掐断的 run 无 DONE，重跑会重复发布未完成部分

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4        # fetch-depth 0：jgit blame 历史（pre-existing 复核）
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build or restore CLI
        run: mvn -B -ntp -pl cra-runner-cli -am package -DskipTests
      - name: Run cra sweep
        run: |
          java -jar cra-runner-cli/target/cra-runner-cli-0.1.0.jar sweep \
            --repo "$GITHUB_REPOSITORY" \
            --since 30d \
            --max-prs 10 \
            --depth quick \
            --token "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRA_LLM_API_KEY: ${{ secrets.CRA_LLM_API_KEY }}
          CRA_LLM_BASE_URL: ${{ vars.CRA_LLM_BASE_URL }}
          CRA_LLM_MODEL: ${{ vars.CRA_LLM_MODEL }}
      - name: persist trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cra-trace-nightly-${{ github.run_id }}
          path: .cra/runs/
          retention-days: 90
