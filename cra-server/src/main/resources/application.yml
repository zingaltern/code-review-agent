server:
  port: ${CRA_SERVER_PORT:8080}
  # 优雅停机：先停接入，再等请求完成（队列 bean 的 destroyMethod 随后排水）
  shutdown: graceful

spring:
  application:
    name: cra-server
  datasource:
    url: ${CRA_SERVER_DB_URL:jdbc:postgresql://localhost:5432/cra}
    username: ${CRA_SERVER_DB_USER:cra}
    password: ${CRA_SERVER_DB_PASSWORD:cra}
    hikari:
      maximum-pool-size: ${CRA_SERVER_DB_POOL:10}
      connection-timeout: 5000
      initialization-fail-timeout: 10000
  lifecycle:
    timeout-per-shutdown-phase: ${CRA_SERVER_SHUTDOWN_GRACE:30s}
  task:
    scheduling:
      pool:
        size: 1

logging:
  level:
    root: INFO
